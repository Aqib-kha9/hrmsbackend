<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%" style="background:#fefefe;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);font-family:system-ui,-apple-system,sans-serif;">
